<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICE CREAM</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin:0; padding:0; font-family: Arial; }
        body { background: linear-gradient(135deg, #ffdee9, #b5fffc); min-height: 100vh; padding: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
        .main-layout { display: flex; gap: 8px; }
        .panel { width: 180px; background: rgba(255,255,255,0.85); border: 3px solid #ffccd5; border-radius: 12px; padding: 8px; font-size: 13px; font-weight: bold; }
        .center { width: 240px; }
        .btn { background: #ff6b8b; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn:disabled { background: #ccc; }
        .ice { width: 110px; height: 110px; background: radial-gradient(#fff, #ffccd5); border: 4px solid #fff; border-radius: 50%; font-size: 60px; display: flex; justify-content: center; align-items: center; margin: 10px auto; transition: 0.05s; box-shadow: 0 4px 10px rgba(255,182,193,0.5); }
        .ice:active { transform: scale(0.9); }
        .num-pop { position: absolute; color: #ff6b8b; font-weight: bold; font-size: 22px; animation: fUp 0.5s ease-out forwards; pointer-events: none; text-shadow: 1px 1px #fff; z-index: 5; }
        @keyframes fUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
        .panel-block { background: rgba(255,255,255,0.85); border: 3px solid #ffccd5; border-radius: 12px; padding: 8px; }
        .item-box { background: #fff; border: 1px solid #ffe4e1; border-radius: 8px; padding: 5px; margin-top: 5px; font-size: 11px; text-align: left; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .box { background: #fff; padding: 25px; border-radius: 15px; text-align: center; border: 3px solid #ffccd5; width: 260px; }
        .box input { margin: 10px; padding: 5px; text-align: center; font-size: 16px; width: 90%; border-radius: 6px; border: 1px solid #ccc; }
        .shop-scroll { max-height: 260px; overflow-y: auto; padding-right: 2px; }
    </style>
</head>
<body>
    <div class="overlay" id="l-ol"><div class="box"><h3>ENTER YOUR NAME</h3><input type="text" id="n-in" placeholder="Your Name..." maxlength="10"><br><button class="btn" style="font-size:16px; padding:8px;" id="st-btn">START GAME</button></div></div>
    <h2 id="w-tl" style="font-size:18px; color:#ff6b8b; text-shadow: 1px 1px #fff;">🍨 1st WORLD 🍨</h2>
    <div class="main-layout">
        <div class="side-panel panel">
            <div style="font-size:14px; border-bottom:2px dashed #ffccd5; padding-bottom:3px; margin-bottom:5px;">🌐 RANKING</div>
            <div style="color:#ff6b8b; padding: 4px 0; font-size:13px;">🥇 <span id="m-nm">YOU</span> (<span id="r1">0</span>)</div>
            <div style="padding: 2px 0; color:#666;">🥈 Cookie (150k)</div>
            <div style="padding: 2px 0; color:#666;">🥉 Sweets (50k)</div>
        </div>
        <div class="center-area center" id="c-area" style="position:relative;">
            <h1 id="sc" style="font-size:38px; color:#ff6b8b; text-shadow: 1px 1px #fff;">0</h1>
            <div style="font-size:13px; font-weight:bold; color:#555; margin-bottom:5px;">CPS: <span id="cps">0</span> | MULTI: x<span id="mult">1</span></div>
            <div class="icecream ice" id="item-btn">🍨</div>
            <div class="panel-block" style="margin-top:5px;">
                <div style="font-size:12px; color:#ff6b8b; font-weight:bold; text-align:left; border-bottom:1px dashed #ffccd5; padding-bottom:2px;">👗 SKINS</div>
                <div style="display:flex; gap:5px; margin-top:5px; justify-content:center;">
                    <button class="btn" style="width:40px; font-size:16px;" id="sk0">🍨</button>
                    <button class="btn" style="width:40px; font-size:16px;" id="sk1" disabled style="opacity:0.4;">🍦</button>
                    <button class="btn" style="width:40px; font-size:16px;" id="sk2" disabled style="opacity:0.4;">🍧</button>
                </div>
            </div>
            <div class="panel-block" style="margin-top:5px;">
                <div style="font-size:12px; color:#ff6b8b; font-weight:bold; text-align:left; border-bottom:1px dashed #ffccd5; padding-bottom:2px;">✨ WORLDS</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:12px;"><div>REBORNS: <span id="rb-cnt">0</span>/5</div><button class="btn" id="rb-btn" disabled style="width:80px;">REBORN</button></div>
                <button class="btn world-btn" id="world-btn" disabled style="margin-top:4px;">TRAVEL TO 2nd WORLD</button>
            </div>
        </div>
        <div class="side-panel panel">
            <div style="font-size:14px; border-bottom:2px dashed #ffccd5; padding-bottom:3px; margin-bottom:5px;">🏪 SWEET SHOP</div>
            <div class="shop-scroll">
                <div class="item-box"><button class="btn" id="b1">CHERRY (<span id="c1">15</span>)</button><div style="margin-top:2px;">Count: <span id="n1">0</span> (+0.1)</div></div>
                <div class="item-box"><button class="btn" id="b2">COOKIE (<span id="c2">100</span>)</button><div style="margin-top:2px;">Count: <span id="n2">0</span> (+1.0)</div></div>
                <div class="item-box"><button class="btn" id="b3">MACARON (<span id="c3">500</span>)</button><div style="margin-top:2px;">Count: <span id="n3">0</span> (+5.0)</div></div>
                <div class="item-box"><button class="btn" id="b4">SUNDAE (<span id="c4">2000</span>)</button><div style="margin-top:2px;">Count: <span id="n4">0</span> (+20)</div></div>
                <div class="item-box"><button class="btn" id="b5">FACTORY (<span id="c5">10000</span>)</button><div style="margin-top:2px;">Count: <span id="n5">0</span> (+100)</div></div>
                <div class="item-box"><button class="btn" id="b6">ALCHEMY (<span id="c6">50000</span>)</button><div style="margin-top:2px;">Count: <span id="n6">0</span> (+500)</div></div>
            </div>
        </div>
    </div>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let score=0, cps=0, reborns=0, multiplier=1, currentWorld=1, hi=localStorage.getItem('hi3') || 0, pName=localStorage.getItem('pName') || '';
        let costs=[15,100,500,2000,10000,50000], nums=[0,0,0,0,0,0], cAmts=[0.1,1.0,5.0,20.0,100.0,500.0];
        function hOl() { document.getElementById('l-ol').style.display = 'none'; if (audioCtx.state === 'suspended') audioCtx.resume(); }
        if(pName) { hOl(); document.getElementById('m-nm').innerText = pName; }
        const stEv = () => { const val = document.getElementById('n-in').value.trim(); pName = val ? val : 'Player'; localStorage.setItem('pName', pName); document.getElementById('m-nm').innerText = pName; hOl(); };
        document.getElementById('st-btn').addEventListener('touchstart', (e) => { e.preventDefault(); stEv(); });
        document.getElementById('st-btn').addEventListener('click', () => { stEv(); });
        function sound(f, d) { if (audioCtx.state === 'suspended') audioCtx.resume(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); }
        function pop(t, e) { const a = document.getElementById('c-area'), d = document.createElement('div'); d.className = 'num-pop'; d.innerText = t; const tch = e.touches ? e.touches : e; const r = a.getBoundingClientRect(); d.style.left = (tch.clientX - r.left - 10) + 'px'; d.style.top = (tch.clientY - r.top - 20) + 'px'; a.appendChild(d); setTimeout(() => d.remove(), 500); }
        function cSk(e, r) { if(reborns >= r) { document.getElementById('item-btn').innerText = e; sound(500, 0.05); } }
        document.getElementById('sk0').addEventListener('touchstart', (e) => { e.preventDefault(); cSk('🍨', 0); });
        document.getElementById('sk1').addEventListener('touchstart', (e) => { e.preventDefault(); cSk('🍦', 5); });
        document.getElementById('sk2').addEventListener('touchstart', (e) => { e.preventDefault(); cSk('🍧', 15); });
        function uBg() { if (currentWorld === 2) { document.body.style.background = 'linear-gradient(135deg, #4b0082, #000080)'; document.body.style.color = '#fff'; return; } if (score >= 500) document.body.style.background = 'linear-gradient(135deg, #ff9a9e, #fecfef)'; else if (score >= 100) document.body.style.background = 'linear-gradient(135deg, #a1c4fd, #c2e9fb)'; else document.body.style.background = 'linear-gradient(135deg, #ffdee9, #b5fffc)'; }
        function ui() {
            const m = currentWorld === 2 ? 2 : 1; document.getElementById('sc').innerText = Math.floor(score); document.getElementById('cps').innerText = (cps * m).toFixed(1);
            document.getElementById('mult').innerText = multiplier; document.getElementById('rb-cnt').innerText = reborns;
            for(let i=1;i<=6;i++){ document.getElementById('c'+i).innerText = costs[i-1].toLocaleString(); document.getElementById('n'+i).innerText = nums[i-1]; }
            document.getElementById('r1').innerText = Math.floor(hi).toLocaleString(); document.getElementById('rb-btn').disabled = (score < 1000);
            document.getElementById('world-btn').disabled = (reborns < 5 || currentWorld === 2);
            document.getElementById('sk1').disabled = (reborns < 5); if(reborns >= 5) document.getElementById('sk1').style.opacity = '1';
            document.getElementById('sk2').disabled = (reborns < 15); if(reborns >= 15) document.getElementById('sk2').style.opacity = '1'; uBg();
        }
        const clEv = (e) => { const g = (1 + reborns) * (currentWorld === 2 ? 2 : 1); score += g; sound(600, 0.05); pop('+' + g, e); if(score > hi) { hi = score; localStorage.setItem('hi3', hi); } ui(); };
        document.getElementById('item-btn').addEventListener('touchstart', (e) => { e.preventDefault(); clEv(e); });
        function buyItem(i, f) { if (score >= costs[i]) { score -= costs[i]; nums[i]++; cps += cAmts[i]; costs[i] = Math.floor(costs[i] * 1.15); sound(f, 0.08); ui(); } else { sound(200, 0.1); } }
        for(let i=1;i<=6;i++){ document.getElementById('b'+i).addEventListener('touchstart', (e) => { e.preventDefault(); buyItem(i-1, 650 + (i*50)); }); }
        document.getElementById('rb-btn').addEventListener('touchstart', (e) => { e.preventDefault(); if (score >= 1000) { score = 0; cps = 0; nums=[0,0,0,0,0,0]; costs=[15,100,500,2000,10000,50000]; reborns++; multiplier = reborns + 1; sound(1300, 0.2); ui(); } });
        document.getElementById('world-btn').addEventListener('touchstart', (e) => { e.preventDefault(); if (reborns >= 5) { currentWorld = 2; document.getElementById('w-tl').innerText = '🚀 SPACE ICE CREAM (2nd WORLD) 🚀'; document.getElementById('w-tl').style.color = '#9370db'; sound(1500, 0.4); ui(); } });
        setInterval(() => { score += (cps * (currentWorld === 2 ? 2 : 1)) / 10; if(score > hi) { hi = score; localStorage.setItem('hi3', hi); } ui(); }, 100); ui();
    </script>
</body>
</html>
